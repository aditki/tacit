name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy tacit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Hermetic test suite
        run: uv run pytest -vv

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Hermetic vendor contract tests
        run: uv run pytest tests/integration -m integration -vv
      - name: Generated vendor contract smoke test
        shell: bash
        run: |
          set -euo pipefail
          vendors_file="tests/contracts/vendor_specs/vendors.txt"
          if [[ -f "${vendors_file}" ]]; then
            mapfile -t vendors < "${vendors_file}"
            uv run python -m tests.contracts.vendor_specs.validate --vendors "${vendors[@]}"
          else
            uv run python -m tests.contracts.vendor_specs.validate --allow-empty
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Install browser runtime
        run: uv run playwright install --with-deps chromium
      - name: Hermetic end-to-end workflows
        run: uv run pytest -q -m e2e tests/e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t tacit:ci .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Git-object-free current tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir .gitleaks-worktree
          git archive --format=tar HEAD | tar -xf - -C .gitleaks-worktree
      - name: Gitleaks committed history
        uses: docker://zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source /github/workspace --log-opts=--all --redact --verbose
      - name: Gitleaks current tree
        uses: docker://zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        with:
          args: detect --source /github/workspace/.gitleaks-worktree --no-git --redact --verbose

  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Install package in clean environment
        run: |
          uv venv .fresh-venv
          uv pip install --python .fresh-venv/bin/python .
          .fresh-venv/bin/tacit --version
